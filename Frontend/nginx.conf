# Serves the built Angular app and reverse-proxies the backend so the browser
# only ever talks to one origin — matches environment.prod.ts, which uses
# relative URLs (apiPrefix: '/api/leadai', wsUrl: '') rather than an absolute
# host. `backend` is the Docker network alias the deploy workflow attaches the
# backend container under (same `outbound-net` network as this container).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/leadai/ {
        proxy_pass http://backend:6789/api/leadai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Websocket (live conversation updates)
    location /ws/ {
        proxy_pass http://backend:6789/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Angular routing: any path that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
