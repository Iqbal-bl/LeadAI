<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1
        class="text-2xl font-bold tracking-tight"
        style="color: var(--app-text)"
      >
        Permissions Matrix
      </h1>
      <p class="text-sm" style="color: var(--app-text-muted)">
        View the permission structure across all system roles.
      </p>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div
      class="card-base p-5 flex items-center justify-between"
      style="background: var(--card-bg)"
    >
      <div class="space-y-1">
        <span
          class="text-xs font-semibold uppercase tracking-wider text-slate-400"
          >Total Roles</span
        >
        <h3 class="text-2xl font-bold" style="color: var(--app-text)">
          {{ totalRoles }}
        </h3>
        <span class="text-[10px] text-indigo-500 font-semibold"
          >System roles defined</span
        >
      </div>
      <div
        class="w-12 h-12 rounded-xl flex items-center justify-center bg-indigo-500/10 text-indigo-500"
      >
        <i class="pi pi-shield text-xl"></i>
      </div>
    </div>

    <div
      class="card-base p-5 flex items-center justify-between"
      style="background: var(--card-bg)"
    >
      <div class="space-y-1">
        <span
          class="text-xs font-semibold uppercase tracking-wider text-slate-400"
          >Total Permissions</span
        >
        <h3 class="text-2xl font-bold text-purple-500">
          {{ totalPermissions }}
        </h3>
        <span class="text-[10px] text-purple-500 font-semibold"
          >Defined actions</span
        >
      </div>
      <div
        class="w-12 h-12 rounded-xl flex items-center justify-center bg-purple-500/10 text-purple-500"
      >
        <i class="pi pi-lock text-xl"></i>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div
    class="flex items-center justify-between gap-4 p-4 card-base"
    style="background: var(--card-bg)"
  >
    <div class="w-full max-w-md">
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input
          type="text"
          pInputText
          [(ngModel)]="searchQuery"
          placeholder="Search permissions..."
          class="w-full text-sm"
        />
      </p-iconfield>
    </div>
    <button
      pButton
      icon="pi pi-refresh"
      class="p-button-outlined p-button-secondary cursor-pointer"
      pTooltip="Refresh"
      tooltipPosition="left"
      (click)="loadPermissions()"
    ></button>
  </div>

  <!-- Matrix Table -->
  <div class="card-base overflow-hidden" style="background: var(--card-bg)">
    <div *ngIf="loading" class="flex justify-center py-16">
      <p-progressSpinner
        strokeWidth="3"
        styleClass="w-12 h-12"
      ></p-progressSpinner>
    </div>

    <div *ngIf="!loading" class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr
            class="border-b"
            style="border-color: var(--app-border)"
          >
            <th
              class="text-left px-5 py-4 font-semibold text-xs uppercase tracking-wider"
              style="color: var(--app-text-secondary)"
            >
              Permission
            </th>
            <th
              *ngFor="let role of roles"
              class="text-center px-4 py-4 font-semibold text-xs uppercase tracking-wider"
              style="color: var(--app-text-secondary)"
            >
              {{ formatRoleName(role) }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let perm of getFilteredPermissions(); let odd = odd"
            class="border-b transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/30"
            [class.bg-slate-25]="odd"
            style="border-color: var(--app-border)"
          >
            <td class="px-5 py-3.5">
              <div class="flex flex-col">
                <span
                  class="font-medium text-sm"
                  style="color: var(--app-text)"
                  >{{ permissions[perm] }}</span
                >
                <span
                  class="text-[11px] font-mono opacity-50"
                  style="color: var(--app-text-muted)"
                  >{{ perm }}</span
                >
              </div>
            </td>
            <td
              *ngFor="let role of roles"
              class="text-center px-4 py-3.5"
            >
              <i
                *ngIf="hasPermission(role, perm)"
                class="pi pi-check-circle text-green-500 text-lg"
              ></i>
              <i
                *ngIf="!hasPermission(role, perm)"
                class="pi pi-minus text-slate-300 dark:text-slate-600 text-lg"
              ></i>
            </td>
          </tr>

          <!-- Empty state -->
          <tr *ngIf="getFilteredPermissions().length === 0">
            <td
              [attr.colspan]="roles.length + 1"
              class="text-center py-12"
              style="color: var(--app-text-muted)"
            >
              <i class="pi pi-search text-3xl mb-2 opacity-35 block"></i>
              <span class="text-sm font-semibold"
                >No permissions match your search.</span
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
