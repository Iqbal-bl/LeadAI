<p-sidebar
  [(visible)]="visible"
  position="right"
  [style]="{
    width: '400px',
    background: 'var(--card-bg)',
    'border-left': '1px solid var(--app-border)',
  }"
>
  <!-- Header Actions -->
  <ng-template pTemplate="header">
    <div class="flex items-center justify-between w-full pr-4">
      <div class="flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center bg-brand-500/10 text-brand-600 dark:text-brand-400"
        >
          <i class="pi pi-bell text-base"></i>
        </div>
        <span class="font-bold text-lg" style="color: var(--app-text)"
          >Notifications</span
        >
        <span
          *ngIf="unreadCount > 0"
          class="px-2 py-0.5 rounded-full text-xs font-bold bg-danger-500 text-white animate-pulse-soft"
        >
          {{ unreadCount }}
        </span>
      </div>
      <button
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead()"
        class="text-xs font-semibold text-brand-600 hover:text-brand-700 transition-colors cursor-pointer border border-transparent hover:border-brand-500/20 px-2.5 py-1 rounded bg-brand-500/5"
      >
        Mark all read
      </button>
    </div>
  </ng-template>

  <!-- Notification List -->
  <div class="space-y-3 mt-4 h-full overflow-y-auto pr-1">
    <div
      *ngIf="notifications.length === 0"
      class="py-16 text-center"
      style="color: var(--app-text-muted)"
    >
      <i
        class="pi pi-check-circle text-5xl mb-4 block opacity-30 text-green-500"
      ></i>
      <p class="text-sm font-semibold">You're all caught up!</p>
      <p class="text-xs mt-1">No new notifications for your role.</p>
    </div>

    <div
      *ngFor="let notification of notifications"
      class="flex gap-3 p-3.5 rounded-xl border transition-all duration-200 cursor-pointer group relative overflow-hidden"
      [class.opacity-60]="notification.read"
      [style.border-color]="
        notification.read ? 'var(--app-border-light)' : 'var(--app-border)'
      "
      [style.background]="
        notification.read ? 'transparent' : 'var(--app-bg-secondary)'
      "
      (click)="markAsRead(notification)"
    >
      <!-- Colored indicator bar for unread notifications -->
      <div
        *ngIf="!notification.read"
        class="absolute left-0 top-0 bottom-0 w-1 bg-brand-500"
      ></div>

      <!-- Icon -->
      <div
        class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
        [ngClass]="getSeverityClass(notification.severity)"
      >
        <i [class]="notification.icon" class="text-sm"></i>
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-2">
          <div class="flex flex-col min-w-0">
            <!-- Title & Unread Indicator -->
            <span
              class="text-sm font-bold truncate"
              style="color: var(--app-text)"
            >
              {{ notification.title }}
            </span>
          </div>
          <button
            (click)="dismiss(notification); $event.stopPropagation()"
            class="opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-black/5 dark:hover:bg-white/5"
            style="color: var(--app-text-muted)"
            pTooltip="Dismiss"
            tooltipPosition="left"
          >
            <i class="pi pi-times text-xs"></i>
          </button>
        </div>

        <p
          class="text-xs mt-1 leading-relaxed"
          style="color: var(--app-text-secondary)"
        >
          {{ notification.message }}
        </p>

        <div class="flex items-center gap-2 mt-2">
          <!-- Notification Category Tag -->
          <span
            class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded"
            [ngClass]="{
              'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400':
                notification.read,
              'bg-brand-500/10 text-brand-600 dark:text-brand-400':
                !notification.read,
            }"
          >
            {{ notification.type }}
          </span>
          <span class="text-[10px]" style="color: var(--app-text-muted)">
            {{ notification.time }}
          </span>
        </div>
      </div>

      <!-- Unread dot -->
      <div
        *ngIf="!notification.read"
        class="w-2 h-2 rounded-full bg-brand-500 flex-shrink-0 mt-2.5"
      ></div>
    </div>
  </div>
</p-sidebar>
