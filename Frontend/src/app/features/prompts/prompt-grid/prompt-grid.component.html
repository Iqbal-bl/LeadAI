<div class="space-y-4">
  <!-- Prompts Grid -->
  <div
    *ngIf="!promptsLoading; else promptsLoad"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
  >
    <div
      *ngFor="let p of prompts"
      class="card-base p-5 flex flex-col justify-between hover:border-slate-700 transition-colors"
    >
      <div>
        <div class="flex items-start justify-between gap-3 mb-3">
          <div>
            <h3 class="text-base font-bold" style="color: var(--app-text)">
              {{ p.title }}
            </h3>
            <span
              class="text-[10px] font-mono text-indigo-600 dark:text-indigo-400 font-bold bg-indigo-500/10 px-2 py-0.5 rounded-full mt-1 inline-block"
            >
              {{ p.key }}
            </span>
          </div>
          <span
            class="px-2 py-0.5 rounded-full text-[9px] font-bold border uppercase tracking-wider"
            [ngClass]="{
              'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20':
                p.is_customised,
              'bg-slate-100 dark:bg-slate-800 text-slate-505 dark:text-slate-400 border-slate-200 dark:border-slate-700':
                !p.is_customised,
            }"
          >
            {{ p.is_customised ? "Customised" : "System Default" }}
          </span>
        </div>

        <p
          class="text-xs mb-4 leading-normal"
          style="color: var(--app-text-secondary)"
        >
          {{ p.description }}
        </p>

        <!-- Prompt Snippet -->
        <div
          class="p-3 rounded-lg border font-mono text-[10px] leading-relaxed max-h-[140px] overflow-y-auto whitespace-pre-wrap select-all"
          style="background: #090d16; color: #cbd5e1; border-color: #1e293b"
        >
          {{ p.content }}
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="flex gap-2.5 mt-5 pt-3.5 border-t border-slate-800/80">
        <button
          pButton
          icon="pi pi-pencil"
          label="Edit Template"
          class="p-button-sm flex-1"
          (click)="onEdit.emit(p)"
        ></button>
        <button
          pButton
          icon="pi pi-refresh"
          label="Reset Default"
          [disabled]="!p.is_customised"
          class="p-button-sm p-button-outlined p-button-warning"
          (click)="triggerReset(p, $event)"
        ></button>
      </div>
    </div>
  </div>

  <ng-template #promptsLoad>
    <div class="py-12 text-center text-slate-500">
      <i class="pi pi-spin pi-spinner text-3xl mb-2 text-indigo-500"></i>
      <span>Loading prompt templates...</span>
    </div>
  </ng-template>
</div>
