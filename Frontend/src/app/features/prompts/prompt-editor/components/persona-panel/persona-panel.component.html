<div
  class="persona-panel p-3.5 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/60 shadow-2xs mb-4"
>
  <!-- Header / Title -->
  <div
    class="flex items-center justify-between pb-2.5 mb-3 border-b border-slate-200/80 dark:border-slate-800/80"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-6 h-6 rounded-md bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold"
      >
        <i class="pi pi-user text-xs"></i>
      </div>
      <span
        class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300"
      >
        Persona
      </span>
      <span
        class="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200/60 dark:bg-indigo-950/50 dark:text-indigo-300 dark:border-indigo-800"
      >
        Workspace Defaults
      </span>
    </div>
  </div>

  <!-- Rows -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 items-center">
    <!-- Agent Name Field -->
    <div class="flex items-center gap-2.5">
      <label
        class="text-xs font-semibold text-slate-600 dark:text-slate-400 shrink-0 w-24"
      >
        Agent Name:
      </label>
      <div class="flex items-center gap-2 flex-1 max-w-sm">
        <input
          pInputText
          type="text"
          [(ngModel)]="agentName"
          placeholder="e.g. Ritu"
          [disabled]="loading || saving"
          class="p-inputtext-sm text-xs w-full py-1.5 px-3 font-medium bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 rounded-lg"
          (keydown.enter)="saveAgentName()"
        />
        <p-button
          label="Save"
          icon="pi pi-check"
          size="small"
          [loading]="saving"
          [disabled]="loading || saving"
          (onClick)="saveAgentName()"
          [style]="{
            background: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
            border: 'none',
            padding: '0.45rem 0.85rem',
            'font-size': '0.75rem',
          }"
        ></p-button>
      </div>
    </div>

    <!-- Company Field (Read-only) -->
    <div class="flex items-center gap-2.5">
      <label
        class="text-xs font-semibold text-slate-600 dark:text-slate-400 shrink-0 w-20 md:w-16"
      >
        Company:
      </label>
      <div
        class="flex items-center gap-2 text-xs font-semibold text-slate-800 dark:text-slate-200"
      >
        <i class="pi pi-building text-slate-400 text-xs"></i>
        <span>{{ companyName || 'Company Workspace' }}</span>
        <span
          class="text-[10px] font-normal text-slate-400 dark:text-slate-500 bg-slate-200/60 dark:bg-slate-800/80 px-1.5 py-0.5 rounded"
        >
          (read-only)
        </span>
      </div>
    </div>
  </div>

  <!-- Hint Text -->
  <div
    class="mt-2.5 pt-2 border-t border-slate-200/60 dark:border-slate-800/60 text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-1.5"
  >
    <i class="pi pi-info-circle text-indigo-500 text-xs shrink-0"></i>
    <span>
      Set your agent's name once here — every script and prompt using
      <code
        class="px-1 py-0.2 rounded bg-slate-200/70 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-mono"
        >&#123;agent&#125;</code
      >
      will use it automatically.
    </span>
  </div>
</div>
