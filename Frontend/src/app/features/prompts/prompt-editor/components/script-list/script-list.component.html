<div class="card-base p-4">
  <div class="flex items-center justify-between gap-2 mb-4">
    <h3
      class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 truncate mr-1"
      title="Conversational Scripts"
    >
      Conversational Scripts
    </h3>
    <div class="flex gap-1.5 sm:gap-2 flex-shrink-0">
      <button
        *appHasPermission="PERMISSIONS.PROMPT_MANAGE"
        pButton
        icon="pi pi-plus"
        class="p-button-sm p-button-outlined !px-2 sm:!px-3 lg:!px-2 xl:!px-3 [&_.p-button-label]:!hidden sm:[&_.p-button-label]:!inline lg:[&_.p-button-label]:!hidden xl:[&_.p-button-label]:!inline [&_.p-button-icon]:!mr-0 sm:[&_.p-button-icon]:!mr-2 lg:[&_.p-button-icon]:!mr-0 xl:[&_.p-button-icon]:!mr-2"
        label="Create"
        (click)="onCreate.emit()"
      ></button>
      <button
        *appHasPermission="PERMISSIONS.PROMPT_MANAGE"
        pButton
        icon="pi pi-download"
        class="p-button-sm p-button-outlined p-button-secondary !px-2 sm:!px-3 lg:!px-2 xl:!px-3 [&_.p-button-label]:!hidden sm:[&_.p-button-label]:!inline lg:[&_.p-button-label]:!hidden xl:[&_.p-button-label]:!inline [&_.p-button-icon]:!mr-0 sm:[&_.p-button-icon]:!mr-2 lg:[&_.p-button-icon]:!mr-0 xl:[&_.p-button-icon]:!mr-2"
        label="Import"
        (click)="onImport.emit()"
      ></button>
    </div>
  </div>

  <!-- Scripts List -->
  <div
    *ngIf="scripts.length > 0; else noScripts"
    class="space-y-3 max-h-[600px] overflow-y-auto pr-1"
  >
    <div
      *ngFor="let s of scripts"
      (click)="onSelect.emit(s)"
      class="p-3.5 rounded-xl border transition-all cursor-pointer"
      [ngClass]="{
        'border-indigo-500 shadow-md shadow-indigo-500/5 bg-indigo-500/5 dark:bg-indigo-500/10':
          selectedScript?.id === s.id,
        'border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-900/40':
          selectedScript?.id !== s.id,
      }"
    >
      <div class="flex items-start justify-between gap-2 mb-2">
        <div class="truncate">
          <h4
            class="text-sm font-bold truncate mb-1"
            style="color: var(--app-text)"
          >
            {{ s.name }}
          </h4>
          <p
            class="text-xs line-clamp-1 leading-normal"
            style="color: var(--app-text-secondary)"
          >
            {{ s.description || "No description provided" }}
          </p>
        </div>
        <div class="flex flex-col gap-1 items-end flex-shrink-0">
          <span
            class="px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
          >
            v{{ s.version }}
          </span>
          <span
            class="px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider"
            [ngClass]="{
              'bg-violet-500/15 text-violet-600 dark:text-violet-400':
                s.channel === 'voice',
              'bg-teal-500/15 text-teal-600 dark:text-teal-400':
                s.channel === 'chat',
              'bg-slate-500/15 text-slate-505 dark:text-slate-400':
                s.channel === 'all',
            }"
          >
            {{ s.channel }}
          </span>
        </div>
      </div>

      <div
        class="flex items-center justify-between mt-3 pt-2.5 border-t"
        style="border-color: var(--app-border)"
      >
        <div class="flex gap-1.5">
          <span
            *ngIf="s.is_default"
            class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20"
          >
            Default
          </span>
          <span
            *ngIf="s.is_active"
            class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20"
          >
            Active
          </span>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-1">
          <button
            pButton
            icon="pi pi-bookmark"
            [disabled]="s.is_default"
            class="p-button-text p-button-sm p-button-secondary h-7 w-7 p-0 flex items-center justify-center"
            pTooltip="Set as Default"
            (click)="triggerDefault(s, $event)"
          ></button>
          <button
            pButton
            icon="pi pi-cog"
            class="p-button-text p-button-sm p-button-secondary h-7 w-7 p-0 flex items-center justify-center"
            pTooltip="Script Settings"
            (click)="triggerSettings(s, $event)"
          ></button>
          <button
            pButton
            icon="pi pi-trash"
            [disabled]="s.is_default"
            class="p-button-text p-button-sm p-button-danger h-7 w-7 p-0 flex items-center justify-center"
            pTooltip="Delete Script"
            (click)="triggerDelete(s, $event)"
          ></button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noScripts>
    <div class="text-center py-8 text-slate-500">
      <i class="pi pi-file text-3xl mb-2 block opacity-30"></i>
      <span class="text-xs">No script files configured.</span>
    </div>
  </ng-template>
</div>
