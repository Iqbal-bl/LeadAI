<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm overflow-hidden transition-colors duration-200">
  <!-- Card Header -->
  <div class="px-3.5 py-2.5 border-b border-slate-100 dark:border-slate-700/60 flex items-center gap-2.5">
    <div class="w-6 h-6 rounded-lg bg-brand-500/10 text-brand-600 dark:text-brand-400 flex items-center justify-center flex-shrink-0 text-xs">
      <i class="pi pi-sparkles"></i>
    </div>

    <div class="min-w-0">
      <h2 class="text-xs font-bold text-slate-900 dark:text-slate-100 truncate">AI Content Enhancer</h2>
      <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">Optimize copy tone, structure & hashtags</p>
    </div>
  </div>

  <!-- Accordion List -->
  <p-accordion [value]="['0']">
    @for (category of categories; track category.value) {
      <p-accordion-panel [value]="category.value">
        <p-accordion-header>
          <div class="flex items-center gap-2 min-w-0">
            <i [class]="category.icon" [ngClass]="category.iconColor" class="text-xs flex-shrink-0"></i>
            <span class="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate">
              {{ category.title }}
            </span>
          </div>
        </p-accordion-header>

        <p-accordion-content>
          <p class="text-slate-500 dark:text-slate-400 text-[10px] leading-relaxed mb-2">
            {{ category.description }}
          </p>

          <div class="flex flex-wrap gap-1.5">
            @for (tool of category.tools; track tool.action) {
              <button 
                type="button" 
                class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 hover:bg-brand-600 hover:text-white dark:hover:bg-brand-500 transition-all cursor-pointer border border-slate-200/60 dark:border-slate-600/40" 
                (click)="onToolClick(tool)"
              >
                {{ tool.label }}
              </button>
            }
          </div>
        </p-accordion-content>
      </p-accordion-panel>
    }
  </p-accordion>
</div>
