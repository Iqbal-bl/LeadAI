<aside
  class="w-60 h-screen border-r flex flex-col flex-shrink-0 transition-colors duration-200"
  style="background-color: var(--sidebar-bg); border-color: var(--app-border)"
>
  <!-- Top Section -->
  <div class="flex-1 p-5 overflow-y-auto">
    <!-- Search -->
    <div class="relative mb-6">
      <i
        class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
      ></i>

      <input
        type="text"
        placeholder="Search social platform"
        class="w-full bg-white dark:bg-slate-800 text-sm pl-9 pr-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
        style="color: var(--app-text)"
      />
    </div>

    <!-- Social Navigation -->
    <div class="flex flex-col gap-1.5">
      <a
        routerLink="/client/social-analytics"
        routerLinkActive="bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition-all"
      >
        <i class="pi pi-facebook text-blue-600"></i>
        <span>Facebook</span>
      </a>

      <a
        routerLink="/client/social-analytics"
        routerLinkActive="bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition-all"
      >
        <i class="pi pi-instagram text-pink-500"></i>
        <span>Instagram</span>
      </a>

      <a
        routerLink="/client/social-analytics"
        routerLinkActive="bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition-all"
      >
        <i class="pi pi-at text-slate-700 dark:text-slate-300"></i>
        <span>Threads</span>
      </a>

      <a
        routerLink="/client/social-analytics"
        routerLinkActive="bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition-all"
      >
        <i class="pi pi-twitter text-sky-500"></i>
        <span>Twitter / X</span>
      </a>

      <a
        routerLink="/client/social-analytics"
        routerLinkActive="bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition-all"
      >
        <i class="pi pi-linkedin text-blue-700"></i>
        <span>LinkedIn</span>
      </a>
    </div>
  </div>

  <!-- Upgrade Card -->
  <div class="p-5 mt-auto">
    <div class="bg-brand-500/10 dark:bg-brand-500/20 border border-brand-500/20 rounded-2xl p-4 flex flex-col items-center text-center gap-3">
      <div class="text-xs font-semibold text-slate-800 dark:text-slate-100 leading-snug">
        Upgrade to Unlock Premium AI Analytics
      </div>

      <button
        class="w-full bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium py-2 rounded-xl transition-colors cursor-pointer"
      >
        Upgrade Plan
      </button>
    </div>
  </div>
</aside>
