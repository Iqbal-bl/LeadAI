<!-- ========================================================
     Publish Toast (Tailwind CSS)
========================================================= -->

<p-toast key="publish-toast" position="top-right" appendTo="body">
  <ng-template let-message pTemplate="message">
    <div class="flex items-start gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl p-4 w-[380px] max-w-[calc(100vw-2rem)]">
      <!-- Icon -->
      <div 
        class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 text-white text-xs font-bold shadow-xs"
        [ngClass]="message.severity === 'success' ? 'bg-emerald-600' : (message.severity === 'warn' ? 'bg-amber-500' : 'bg-rose-600')"
      >
        <i
          class="pi"
          [class.pi-check]="message.severity === 'success'"
          [class.pi-exclamation-triangle]="message.severity === 'warn'"
          [class.pi-times]="message.severity === 'error'"
        >
        </i>
      </div>

      <!-- Body -->
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold text-slate-900 dark:text-slate-100 leading-snug">
          {{ message.summary }}
        </p>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-normal mt-0.5">
          {{ message.detail }}
        </p>
      </div>
    </div>
  </ng-template>
</p-toast>

<!-- ========================================================
     Composer Layout (Tailwind CSS)
========================================================= -->

<div class="flex flex-col h-[calc(100vh-6.5rem)] -m-6 lg:-m-8 overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
  <!-- Top Header Bar -->
  <header class="h-12 px-6 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-brand-500/10 text-brand-600 dark:text-brand-400 flex items-center justify-center font-bold text-xs">
        <i class="pi pi-pencil"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold text-slate-900 dark:text-slate-100 tracking-tight">Social Post Composer</h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400">Craft, preview, and publish multi-channel social media posts</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button 
        type="button" 
        (click)="resetComposer()"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-all cursor-pointer"
      >
        <i class="pi pi-refresh text-xs"></i> Reset Draft
      </button>
    </div>
  </header>

  <!-- 3-Column Layout: Independent Column Scrolling -->
  <div class="flex-1 grid grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)_400px] overflow-hidden min-h-0">
    <!-- ========================================================
         LEFT COLUMN: Platform Selector, AI Tools, Schedule
    ========================================================= -->

    <div class="h-full min-h-0 overflow-y-auto p-4 space-y-4 border-r border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/40">
      <!-- Account Selector -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 p-3.5 shadow-sm">
        <app-account-selector [mediaItems]="mediaItems" (accountsChange)="onAccountsChange($event)">
        </app-account-selector>
      </div>

      <!-- AI Tools -->
      <app-ai-tools></app-ai-tools>

      <!-- Schedule -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm overflow-hidden">
        <app-schedule-bar [(publishMode)]="publishMode" (scheduledUtcChange)="onScheduledUtcChange($event)"> </app-schedule-bar>
      </div>
    </div>

    <!-- ========================================================
         CENTER COLUMN: Post Editor, Media Toolbar, Actions
    ========================================================= -->

    <div class="h-full min-h-0 overflow-y-auto p-5 space-y-4 flex flex-col">
      <!-- Post Editor -->
      <app-post-editor 
        [(postContent)]="postContent"
        [resetVersion]="resetVersion" 
        (contentChange)="onPostContentChange($event)"
      >
      </app-post-editor>

      <!-- Media Toolbar -->
      <app-media-toolbar 
        [resetVersion]="resetVersion" 
        (mediaChange)="onMediaChange($event)"
        (aiContentGenerated)="onPostContentChange($event)"
      >
      </app-media-toolbar>

      <!-- Composer Actions -->
      <div class="pt-1 mt-auto">
        <app-composer-actions
          [publishMode]="publishMode"
          [isPublishing]="isPublishing"
          (publish)="onPublish()"
          (saveDraft)="onSaveDraft()"
          (cancel)="onCancel()"
        >
        </app-composer-actions>
      </div>
    </div>

    <!-- ========================================================
         RIGHT COLUMN: Live Social Media Preview
    ========================================================= -->

    <div class="h-full min-h-0 overflow-y-auto p-4 border-l border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/40">
      <app-live-preview
        class="block w-full min-w-0"
        [postText]="postContent"
        [selectedAccounts]="selectedAccounts"
        [mediaItems]="mediaItems"
      >
      </app-live-preview>
    </div>
  </div>
</div>
