<div class="card-base p-5">
  <h3
    class="text-sm font-semibold mb-4 flex items-center justify-between gap-2"
    style="color: var(--app-text)"
  >
    <div><i class="pi pi-comments text-brand-500"></i> Conversations</div>
    <div class="flex items-center gap-3">
      <i
        class="pi pi-window-maximize hover:text-brand-500 cursor-pointer transition-colors"
        (click)="maximizeChat()"
        title="Maximize to Full Size"
      ></i>
    </div>
  </h3>

  <div *ngIf="!isMinimized" class="transition-all duration-300">
    <!-- Messages Log (chat bubble format) -->
    <div
      class="max-h-[350px] overflow-y-auto mb-4 p-4 space-y-4 rounded-xl border"
      style="
        background-color: var(--app-bg-secondary, #fafafa);
        border-color: var(--app-border);
      "
      #chatContainer
    >
      <ng-container *ngTemplateOutlet="conversationList"></ng-container>
    </div>

    <!-- Reply Input Field -->
    <div class="flex gap-3">
      <input
        type="text"
        [(ngModel)]="replyMessage"
        placeholder="Type your response to customer..."
        class="flex-1 px-4 py-3 rounded-xl border text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
        style="
          background-color: var(--card-bg);
          color: var(--app-text);
          border-color: var(--app-border);
        "
        (keyup.enter)="onSendReply()"
      />
      <button
        (click)="onSendReply()"
        [disabled]="!replyMessage.trim() || sendingReply"
        class="px-6 py-3 rounded-xl text-white text-sm font-semibold flex items-center gap-2 cursor-pointer transition-all duration-200 hover:shadow-lg disabled:opacity-50"
        style="background: linear-gradient(135deg, #8b5cf6, #6366f1)"
      >
        <i class="pi pi-send" *ngIf="!sendingReply"></i>
        <i class="pi pi-spin pi-spinner" *ngIf="sendingReply"></i>
        <span>Send</span>
      </button>
    </div>
  </div>
</div>

<!-- Full Size Conversation Preview Dialog -->
<p-dialog
  header="Conversations"
  [(visible)]="displayFullSize"
  [modal]="true"
  [contentStyle]="{ 'padding': '1.5rem', 'background-color': 'var(--card-bg)', 'color': 'var(--app-text)' }"
>
  <div
    class="overflow-y-auto p-4 space-y-4 rounded-xl border "
    style="
      background-color: var(--app-bg-secondary, #fafafa);
      border-color: var(--app-border);
    "
  >
    <ng-container *ngTemplateOutlet="conversationList"></ng-container>
  </div>
</p-dialog>

<!-- Reusable Conversation List Template -->
<ng-template #conversationList>
  <ng-container *ngFor="let msg of conversations">
    <!-- System message -->
    <div *ngIf="msg.sender === 'system'" class="flex justify-center">
      <div
        class="px-4 py-1.5 rounded-full text-[11px] font-medium"
        style="
          background-color: var(--app-bg-secondary, #f1f5f9);
          color: var(--app-text-muted, #b89494);
          border: 1px solid var(--app-border);
        "
      >
        {{ msg.summary }}
        <span class="ml-1 opacity-60">·</span>
        <span class="opacity-60">{{ msg.startTime | date: "shortTime" }}</span>
      </div>
    </div>

    <!-- Agent / Customer bubble -->
    <div
      *ngIf="msg.sender !== 'system'"
      class="flex flex-col"
      [class.items-end]="msg.type === 'Human'"
      [class.items-start]="msg.type !== 'Human'"
    >
      <div
        class="max-w-[80%] px-4 py-3 rounded-2xl text-sm shadow-sm"
        [style.background-color]="
          msg.type === 'Human' ? '#6366f1' : 'var(--card-bg)'
        "
        [style.color]="msg.type === 'Human' ? '#ffffff' : 'var(--app-text)'"
        [style.border]="
          msg.type === 'Human' ? 'none' : '1px solid var(--app-border)'
        "
        [ngClass]="
          msg.type === 'Human' ? 'rounded-tr-none' : 'rounded-tl-none'
        "
      >
        <div
          class="font-semibold text-[10px] mb-1.5 opacity-75"
          [style.color]="
            msg.type === 'Human' ? '#e0e7ff' : 'var(--app-text-muted)'
          "
        >
          {{
            msg.type === "Human"
              ? "Customer"
              : msg.agent === "Agent"
                ? "Agent"
                : "AI Assistant"
          }}
          · {{ msg.startTime | date: "mediumTime" }}
        </div>
        <div class="whitespace-pre-wrap leading-relaxed">
          {{ msg.summary }}
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Empty state -->
  <div
    *ngIf="conversations.length === 0"
    class="text-center py-8 text-sm text-slate-400"
  >
    No messages in this conversation.
  </div>
</ng-template>
