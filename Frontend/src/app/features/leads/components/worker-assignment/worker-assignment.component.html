<div class="card-base p-5">
  <h3 class="text-sm font-semibold mb-4 flex items-center gap-2" style="color: var(--app-text);">
    <i class="pi pi-user-edit text-brand-500"></i> Worker Assignment
  </h3>
  <div class="space-y-3">
    <div>
      <label class="text-xs font-medium block mb-1.5" style="color: var(--app-text-muted);">Assigned Agent</label>
      <p-dropdown
        [options]="teamOptions"
        [(ngModel)]="selectedAgent"
        placeholder="Select agent"
        [style]="{ width: '100%' }"
        optionLabel="label"
        optionValue="value"
        (onChange)="onAgentChange($event.value)">
      </p-dropdown>
    </div>
    <div class="flex items-center gap-2 text-xs" style="color: var(--app-text-muted);">
      <i class="pi pi-check-circle"
         [class.text-success-500]="lead?.assignedTo !== 'Unassigned'"
         [class.text-slate-500]="lead?.assignedTo === 'Unassigned'"></i>
      <span>
        {{ lead?.assignedTo === 'Unassigned' ? 'Unassigned' : 'Assigned to ' + lead?.assignedTo }}
      </span>
    </div>
  </div>
</div>
