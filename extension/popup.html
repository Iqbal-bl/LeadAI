<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadAI LinkedIn Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #0A66C2, #0284c7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.warning {
      background: #f59e0b;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #0A66C2, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      opacity: 0.95;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      min-height: 16px;
    }
    .success {
      color: #34d399;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">in</div>
    <div>
      <div class="title">LeadAI LinkedIn Sync</div>
      <div class="subtitle">1-Click Fast Session Bridge</div>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span style="color: #94a3b8;">LinkedIn Session:</span>
      <span id="session-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Checking...</span>
      </span>
    </div>
  </div>

  <button class="btn" id="sync-btn" disabled>
    ⚡ 1-Click Sync to LeadAI
  </button>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
