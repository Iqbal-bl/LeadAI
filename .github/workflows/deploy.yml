name: Build on cloud, deploy backend + frontend to home server via SSH-tunneled registry

# Moved here from Backend/.github/workflows/deploy.yml: GitHub Actions only ever
# reads .github/workflows/ from the REPO ROOT, so that copy never actually ran.
# Also: it used to trigger on `with-outbound`, a branch that no longer exists.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Backend — unchanged in approach from the original workflow, just relocated
  # and re-pathed (checkout now brings the whole monorepo, so the build
  # context is ./Backend rather than the runner's working directory).
  # =========================================================================
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: my-python-app
      CONTAINER_NAME: my-python-app
      HOST_PORT: 6789
      CONTAINER_PORT: 6789
      # Path on the SERVER (Windows). Secrets file is owned by the server
      # admin; it's never in this repo and never in GitHub Secrets.
      ENV_FILE: 'C:\ProgramData\my-python-app\.env'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Allow plain-HTTP push to localhost:5000
        run: |
          echo '{"insecure-registries":["localhost:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Install SSH key and trust server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Probing server reachability..."
          if ! nc -z -w 5 "${{ secrets.SERVER_HOST }}" "${{ secrets.SSH_PORT }}"; then
            echo "::error::Cannot reach ${{ secrets.SERVER_HOST }}:${{ secrets.SSH_PORT }} from GitHub. Check router port-forward and the SERVER_HOST / SSH_PORT secrets."
            exit 1
          fi
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Open SSH tunnel to server-side registry
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
              -i ~/.ssh/id_ed25519 \
              -L 5000:127.0.0.1:5000 \
              -N -f \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}

      - name: Compute next version tag
        id: vars
        run: |
          curl -sf http://localhost:5000/v2/$IMAGE_NAME/tags/list \
            > /tmp/registry_tags_backend.json 2>/dev/null \
            || echo '{"tags":[]}' > /tmp/registry_tags_backend.json

          CURRENT_VERSION=$(python3 -c "import json; d=json.load(open('/tmp/registry_tags_backend.json')); t=d.get('tags') or []; nums=[int(x[1:]) for x in t if x.startswith('v') and x[1:].isdigit()]; print(max(nums, default=0))")
          NEXT_VERSION=$((CURRENT_VERSION + 1))
          echo "VERSION_TAG=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: v$NEXT_VERSION"

      - name: Build image
        run: |
          docker build \
            -t localhost:5000/$IMAGE_NAME:latest \
            -t localhost:5000/$IMAGE_NAME:${{ steps.vars.outputs.VERSION_TAG }} \
            ./Backend

      - name: Push image through tunnel
        run: |
          docker push localhost:5000/$IMAGE_NAME:latest
          docker push localhost:5000/$IMAGE_NAME:${{ steps.vars.outputs.VERSION_TAG }}

      - name: Pull and restart container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            $dockerBin = "C:\Program Files\Docker\Docker\resources\bin"
            $empty = "$dockerBin\docker-credential-empty.exe"
            if (Test-Path $empty) {
              Copy-Item $empty "$dockerBin\docker-credential-wincred.exe" -Force
              Copy-Item $empty "$dockerBin\docker-credential-desktop.exe" -Force
            }

            Write-Host "Deploying backend version: ${{ steps.vars.outputs.VERSION_TAG }}"

            docker pull localhost:5000/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION_TAG }}
            if ($LASTEXITCODE -ne 0) { throw "docker pull failed" }

            docker rm -f ${{ env.CONTAINER_NAME }} 2>$null
            $global:LASTEXITCODE = 0

            if (-not (Test-Path '${{ env.ENV_FILE }}')) {
              Write-Error "Env file not found at ${{ env.ENV_FILE }} - create it on the server first."
              exit 1
            }

            docker network create outbound-net 2>$null
            $global:LASTEXITCODE = 0

            # --network-alias backend: lets the frontend's nginx reach this
            # container as "backend" without renaming it (CONTAINER_NAME stays
            # my-python-app for anyone/anything already referencing that name).
            docker run -d `
              --name ${{ env.CONTAINER_NAME }} `
              --restart unless-stopped `
              --network outbound-net `
              --network-alias backend `
              --env-file '${{ env.ENV_FILE }}' `
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} `
              localhost:5000/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION_TAG }}
            if ($LASTEXITCODE -ne 0) { throw "docker run failed" }

      - name: Close SSH tunnel
        if: always()
        run: pkill -f 'ssh.*-L 5000:127.0.0.1:5000' || true

  # =========================================================================
  # Frontend — same tunnel-to-local-registry pattern as backend, packaged as
  # an nginx image (Frontend/Dockerfile) that serves the Angular build and
  # reverse-proxies /api/leadai and /ws to the backend container by its
  # "backend" network alias (see Frontend/nginx.conf). Runs on its own
  # runner VM in parallel with the backend job — no shared state between them
  # beyond the server itself.
  # =========================================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: my-python-app-frontend
      CONTAINER_NAME: my-python-app-frontend
      HOST_PORT: 8080
      CONTAINER_PORT: 80

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Allow plain-HTTP push to localhost:5000
        run: |
          echo '{"insecure-registries":["localhost:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Install SSH key and trust server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! nc -z -w 5 "${{ secrets.SERVER_HOST }}" "${{ secrets.SSH_PORT }}"; then
            echo "::error::Cannot reach ${{ secrets.SERVER_HOST }}:${{ secrets.SSH_PORT }} from GitHub. Check router port-forward and the SERVER_HOST / SSH_PORT secrets."
            exit 1
          fi
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Open SSH tunnel to server-side registry
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
              -i ~/.ssh/id_ed25519 \
              -L 5000:127.0.0.1:5000 \
              -N -f \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}

      - name: Compute next version tag
        id: vars
        run: |
          curl -sf http://localhost:5000/v2/$IMAGE_NAME/tags/list \
            > /tmp/registry_tags_frontend.json 2>/dev/null \
            || echo '{"tags":[]}' > /tmp/registry_tags_frontend.json

          CURRENT_VERSION=$(python3 -c "import json; d=json.load(open('/tmp/registry_tags_frontend.json')); t=d.get('tags') or []; nums=[int(x[1:]) for x in t if x.startswith('v') and x[1:].isdigit()]; print(max(nums, default=0))")
          NEXT_VERSION=$((CURRENT_VERSION + 1))
          echo "VERSION_TAG=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: v$NEXT_VERSION"

      - name: Build image
        run: |
          docker build \
            -t localhost:5000/$IMAGE_NAME:latest \
            -t localhost:5000/$IMAGE_NAME:${{ steps.vars.outputs.VERSION_TAG }} \
            ./Frontend

      - name: Push image through tunnel
        run: |
          docker push localhost:5000/$IMAGE_NAME:latest
          docker push localhost:5000/$IMAGE_NAME:${{ steps.vars.outputs.VERSION_TAG }}

      - name: Pull and restart container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            $dockerBin = "C:\Program Files\Docker\Docker\resources\bin"
            $empty = "$dockerBin\docker-credential-empty.exe"
            if (Test-Path $empty) {
              Copy-Item $empty "$dockerBin\docker-credential-wincred.exe" -Force
              Copy-Item $empty "$dockerBin\docker-credential-desktop.exe" -Force
            }

            Write-Host "Deploying frontend version: ${{ steps.vars.outputs.VERSION_TAG }}"

            docker pull localhost:5000/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION_TAG }}
            if ($LASTEXITCODE -ne 0) { throw "docker pull failed" }

            docker rm -f ${{ env.CONTAINER_NAME }} 2>$null
            $global:LASTEXITCODE = 0

            docker network create outbound-net 2>$null
            $global:LASTEXITCODE = 0

            # Same network as the backend container so nginx can reach it by
            # the "backend" alias set on the backend's docker run.
            docker run -d `
              --name ${{ env.CONTAINER_NAME }} `
              --restart unless-stopped `
              --network outbound-net `
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} `
              localhost:5000/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION_TAG }}
            if ($LASTEXITCODE -ne 0) { throw "docker run failed" }

      - name: Close SSH tunnel
        if: always()
        run: pkill -f 'ssh.*-L 5000:127.0.0.1:5000' || true
